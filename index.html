<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charly kommt zurück</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #6b6b70;
      --accent: #2f5bea;
      --land: #e6e3dc;
      --shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111114;
        --card: #1c1c21;
        --text: #f2f2f5;
        --muted: #9a9aa3;
        --accent: #7c9cff;
        --land: #2b2b33;
        --shadow: 0 10px 30px rgba(0, 0, 0, .4);
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { overflow-x: hidden; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 560px; }
    .flag { font-size: 2.5rem; }
    h1 {
      margin: 12px 0 6px;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      letter-spacing: -.02em;
    }
    .sub { color: var(--muted); margin-bottom: 32px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .box {
      background: var(--card);
      border-radius: 20px;
      padding: 28px 12px;
      box-shadow: var(--shadow);
    }
    .num {
      display: block;
      font-size: clamp(3rem, 16vw, 5.5rem);
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .label {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: .8rem;
    }
    .map { margin-top: 16px; padding: 16px; }
    .map svg { display: block; width: 100%; height: auto; }
    .land { fill: var(--land); stroke: var(--card); stroke-width: 2; stroke-linejoin: round; }
    .route { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
    .done { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
    .dot { fill: var(--accent); }
    .place { fill: var(--text); font: 600 24px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .plane { fill: var(--accent); stroke: var(--card); stroke-width: 1.5; }
    .progress { margin-top: 12px; color: var(--muted); font-size: .95rem; }
    .date { margin-top: 24px; color: var(--muted); font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <div class="flag" aria-hidden="true">✈️</div>
    <h1 id="title">Charly kommt zurück</h1>
    <p class="sub">Noch so lange ist sie in Frankreich</p>
    <div class="grid">
      <div class="box"><span class="num" id="days">–</span><span class="label">Tage</span></div>
      <div class="box"><span class="num" id="hours">–</span><span class="label">Stunden</span></div>
    </div>
    <div class="box map">
      <svg viewBox="0 0 560 530" role="img" aria-label="Karte: Flugzeug auf dem Weg von Frankreich nach Deutschland">
        <path class="land" id="fr"/>
        <path class="land" id="de"/>
        <path class="route" id="route" d="M214 340 Q267 192 423 168"/>
        <path class="done" id="done" d="M214 340 Q267 192 423 168" pathLength="1" stroke-dasharray="0 1"/>
        <circle class="dot" cx="214" cy="340" r="7"/>
        <circle class="dot" cx="423" cy="168" r="7"/>
        <text class="place" x="214" y="380" text-anchor="middle">Frankreich</text>
        <text class="place" x="423" y="140" text-anchor="middle">Deutschland</text>
        <path class="plane" id="plane" transform="translate(214 340)"
          d="M16 0 L6 -2.5 L-2 -15 L-7 -15 L-1 -2.5 L-10 -2.5 L-15 -8 L-18 -8 L-15 0 L-18 8 L-15 8 L-10 2.5 L-1 2.5 L-7 15 L-2 15 L6 2.5 Z"/>
      </svg>
      <p class="progress" id="progress"></p>
    </div>
    <p class="date" id="date">Datum folgt</p>
  </main>
  <script>
    const START = "2026-09-12T00:00:00+02:00"; // Abreise
    // Rückkehr-Datum, z. B. "2027-02-01T18:00:00+01:00". null = noch unbekannt.
    const END = "2026-12-05T00:00:00+01:00";

    // Grobe Landesumrisse als [Längengrad, Breitengrad], keine Orte.
    const FR = [[2.5,51.1],[4.2,50],[4.8,50.15],[5.8,49.5],[6.4,49.45],[7,49.1],[8.2,48.97],[7.6,47.6],[7,47.5],[6,46.4],[6.8,46],[7,45.3],[6.6,44.9],[7,44.2],[7.5,43.8],[6.6,43.2],[5.4,43.2],[4.6,43.4],[3.5,43.3],[3,42.6],[3.2,42.4],[1.7,42.5],[0.7,42.8],[-0.7,42.9],[-1.8,43.4],[-1.2,44.6],[-1.2,46],[-2.2,47.1],[-3,47.5],[-4.4,47.8],[-4.8,48.4],[-4,48.7],[-3,48.8],[-2,48.6],[-1.6,48.7],[-1.9,49.7],[-1.2,49.6],[-0.2,49.3],[0.2,49.5],[1.4,50.1],[1.6,50.9]];
    const DE = [[7.2,53.3],[8,53.6],[8.7,53.9],[8.9,54.3],[8.6,54.9],[9.4,54.85],[10,54.5],[10.9,54],[11.5,54],[12.3,54.3],[13,54.4],[13.6,54.6],[14.2,53.9],[14.4,53.3],[14.1,52.8],[14.6,52.6],[14.7,51.6],[15,51],[14.3,50.9],[13,50.4],[12.1,50.3],[12.5,49.8],[13,49.3],[13.8,48.8],[13.4,48.3],[13,47.8],[12.8,47.6],[11,47.4],[10.2,47.3],[9.6,47.5],[8.6,47.7],[7.6,47.6],[8.2,48.97],[7,49.1],[6.4,49.5],[6.1,50.1],[6.4,50.3],[6.1,50.7],[5.9,51],[6.2,51.4],[5.95,51.8],[6.8,52],[7.05,52.4],[6.7,52.5],[7,53]];
    const toPath = pts => "M" + pts.map(([lon, lat]) =>
      ((lon + 5.5) * 26.76).toFixed(1) + " " + ((55.3 - lat) * 40).toFixed(1)).join("L") + "Z";
    document.getElementById("fr").setAttribute("d", toPath(FR));
    document.getElementById("de").setAttribute("d", toPath(DE));

    // Punkte der Route (quadratische Bézierkurve): Start, Kontrollpunkt, Ziel
    const A = [214, 340], C = [267, 192], B = [423, 168];
    function placePlane(t) {
      const u = 1 - t;
      const x = u*u*A[0] + 2*u*t*C[0] + t*t*B[0];
      const y = u*u*A[1] + 2*u*t*C[1] + t*t*B[1];
      const dx = 2*u*(C[0]-A[0]) + 2*t*(B[0]-C[0]);
      const dy = 2*u*(C[1]-A[1]) + 2*t*(B[1]-C[1]);
      const deg = Math.atan2(dy, dx) * 180 / Math.PI;
      document.getElementById("plane").setAttribute("transform", `translate(${x} ${y}) rotate(${deg}) scale(1.6)`);
      document.getElementById("done").setAttribute("stroke-dasharray", `${t} 1`);
    }

    function tick() {
      if (!END) { placePlane(0); return; }
      const start = new Date(START), end = new Date(END), now = Date.now();
      const ms = end - now;
      const t = Math.min(1, Math.max(0, (now - start) / (end - start)));
      placePlane(t);
      document.getElementById("progress").textContent = Math.floor(t * 100) + " % geschafft";
      document.getElementById("date").textContent =
        end.toLocaleString("de-DE", { dateStyle: "full", timeStyle: "short" });
      if (ms <= 0) {
        document.getElementById("title").textContent = "Charly ist wieder da! 🎉";
        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "0";
        return;
      }
      const h = Math.floor(ms / 3600000);
      document.getElementById("days").textContent = Math.floor(h / 24);
      document.getElementById("hours").textContent = h % 24;
    }
    tick();
    setInterval(tick, 30000);
  </script>
</body>
</html>
